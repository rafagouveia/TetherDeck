[package]
name = "rust-ios-device-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rust-ios-device-api = { path = "../device-api" }
rust-ios-device-client = { path = "../device-client" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[features]
capture-ui = []
