[workspace]
resolver = "2"
members = ["crates/device-api", "crates/device-core", "crates/device-daemon", "crates/device-cli", "crates/device-mcp", "crates/device-diagnostics", "crates/device-client", "crates/device-gui", "crates/device-video", "crates/device-desktop"]
exclude = ["vendor/idevice"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
idevice = { version = "=0.1.68", default-features = false, features = ["rustcrypto", "usbmuxd", "tcp", "screenshotr", "rsd", "core_device", "display_stream", "core_device_proxy", "tunnel_tcp_stack", "dvt", "wda", "xctest", "remote_pairing"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[patch.crates-io]
idevice = { path = "vendor/idevice" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }
accesskit_windows = { path = "vendor/accesskit-windows" }
